# Supabase local development configuration
# https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
scheme = "http"

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"

[auth.email]
enable_signup = true
