name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Run SwiftLint
        run: swiftlint lint --strict

      - name: Run SwiftFormat
        run: swiftformat --lint .

  test:
    name: Test
    runs-on: macos-14
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: |
          curl -Ls https://install.tuist.io | bash
          tuist version

      - name: Generate project
        run: tuist generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme FidelLearn \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            | xcpretty

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult

  build:
    name: Build
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: |
          curl -Ls https://install.tuist.io | bash

      - name: Generate project
        run: tuist generate

      - name: Build app
        run: |
          xcodebuild build \
            -scheme FidelLearn \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  ui-tests:
    name: UI Tests
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: |
          curl -Ls https://install.tuist.io | bash

      - name: Generate project
        run: tuist generate

      - name: Run UI tests
        run: |
          xcodebuild test \
            -scheme FidelLearn \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:FidelLearnUITests \
            | xcpretty
